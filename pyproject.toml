[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dds-frame"
version = "0.0.0"
description = "DDS-native request/reply and publish/subscribe communication frame"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "K.NAKADA" }
]
keywords = [
    "DDS",
    "CycloneDDS",
    "RPC",
    "publish-subscribe",
    "device-control",
]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License", "Operating System :: OS Independent"]

dependencies = [
    "cyclonedds>=11.0.1,<12",
    "msgpack>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/ohara-lab-su/dds_frame"
Documentation = "https://ohara-lab-su.github.io/dds_frame/"
Repository = "https://github.com/ohara-lab-su/dds_frame"
Issues = "https://github.com/ohara-lab-su/dds_frame/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dds_frame"]

[tool.pytest.ini_options]
testpaths = ["tests"]
